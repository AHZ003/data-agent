name: Nightly eval

# Two jobs, both needing the GOOGLE_API_KEY secret:
#
#   golden     Full internal eval (LLM judge on) + CI-aware gate against
#              benchmarks/baselines/golden.json.
#   text2sql   Fixed, difficulty-stratified 200-question subsets of Spider
#              dev and BIRD mini-dev through the production coder path.
#              Results are appended to history.jsonl on the gh-pages
#              branch and the eval dashboard (index.html) is rebuilt, so
#              the published page shows EX with 95% CI bands over commits.
#
# 07:00 UTC daily, or manually from the Actions tab.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Override DATAAGENT_MODEL (blank = default)"
        required: false
        default: ""

concurrency:
  group: nightly-eval
  cancel-in-progress: false

permissions:
  contents: write   # push to gh-pages

jobs:
  golden:
    name: Golden set (judge on) + gate
    runs-on: ubuntu-latest
    # The eval spends the GOOGLE_API_KEY secret: only the owner or the schedule.
    if: github.repository_owner == github.actor || github.event_name == 'schedule'
    timeout-minutes: 45
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      DATAAGENT_MODEL: ${{ github.event.inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked

      - name: Run golden eval
        if: env.GOOGLE_API_KEY != ''
        run: uv run python -m benchmarks.runner --out outputs/eval/nightly

      - name: CI-aware gate
        if: env.GOOGLE_API_KEY != ''
        run: |
          uv run python -m benchmarks.gate \
            --results outputs/eval/nightly/results.json \
            --baseline benchmarks/baselines/golden.json

      - name: Upload report
        if: always() && env.GOOGLE_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-${{ github.run_id }}
          path: outputs/eval/nightly/
          retention-days: 30

  text2sql:
    name: Spider + BIRD subsets → dashboard
    runs-on: ubuntu-latest
    if: github.repository_owner == github.actor || github.event_name == 'schedule'
    timeout-minutes: 90
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      DATAAGENT_MODEL: ${{ github.event.inputs.model }}
      DATAAGENT_LLM_BACKOFF_RETRIES: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked

      - name: Cache benchmark data
        uses: actions/cache@v4
        with:
          path: |
            benchmarks/spider
            benchmarks/bird
          key: text2sql-data-v1

      - name: Download benchmark data
        run: |
          bash benchmarks/spider_setup.sh
          bash benchmarks/bird_setup.sh

      - name: Spider dev (200, stratified)
        if: env.GOOGLE_API_KEY != ''
        run: uv run python -m benchmarks.spider_eval --subset 200 --seed 0 --concurrency 4 --no-cache

      - name: BIRD mini-dev (200, stratified, evidence on)
        if: env.GOOGLE_API_KEY != ''
        run: uv run python -m benchmarks.bird_eval --subset 200 --seed 0 --evidence on --concurrency 4 --no-cache

      - name: Publish to gh-pages
        if: env.GOOGLE_API_KEY != '' && github.event_name == 'schedule'
        run: |
          set -e
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --quiet refs/heads/gh-pages; then
            git worktree add site gh-pages
          else
            git worktree add --detach site
            (cd site && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi
          uv run python -m benchmarks.dashboard append \
            outputs/spider/summary.json outputs/bird/evidence_on/summary.json \
            --history site/history.jsonl
          uv run python -m benchmarks.dashboard build --history site/history.jsonl --out site/index.html
          cd site
          git config user.name "dataagent-nightly-bot"
          git config user.email "nightly@dataagent.local"
          git add history.jsonl index.html
          git commit -m "nightly eval $(date -u +%Y-%m-%dT%H:%M)" || echo "nothing to commit"
          git push origin gh-pages

      - name: Upload reports
        if: always() && env.GOOGLE_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: text2sql-eval-${{ github.run_id }}
          path: |
            outputs/spider/
            outputs/bird/
          retention-days: 30
