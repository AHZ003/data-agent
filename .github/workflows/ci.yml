name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests + SQL guard + tracing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Run pytest
        env:
          GOOGLE_API_KEY: dummy-for-ci
        run: uv run pytest tests/ -q

  eval:
    name: Agent eval gate (rule-based)
    runs-on: ubuntu-latest
    needs: test
    # `secrets` isn't available in job-level `if`; gate each step on env instead.
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        if: env.GOOGLE_API_KEY != ''
        run: uv sync --locked

      - name: Run eval (no LLM judge)
        if: env.GOOGLE_API_KEY != ''
        run: uv run python -m benchmarks.runner --no-judge

      - name: CI-aware gate (fails only if the upper 95% bound is below baseline)
        if: env.GOOGLE_API_KEY != ''
        run: |
          uv run python -m benchmarks.gate \
            --results outputs/eval/results.json \
            --baseline benchmarks/baselines/golden.json

      - name: Upload eval report
        if: always() && env.GOOGLE_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: outputs/eval/
