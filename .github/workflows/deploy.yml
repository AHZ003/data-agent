name: Deploy to Cloud Run

# Deploys main after tests pass. Authenticates with Workload Identity
# Federation (no JSON keys); see deploy/cloudrun.md for the one-time setup.
# Skipped until the GCP_* repository variables exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # GitHub OIDC token for Workload Identity Federation

jobs:
  test:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/ -q
        env:
          GOOGLE_API_KEY: dummy-for-ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          gcloud run deploy dataagent --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances 2 --min-instances 0 --memory 2Gi --cpu 1 --timeout 300 \
            --set-secrets GOOGLE_API_KEY=gemini-api-key:latest \
            --set-env-vars DEMO_MODE=1,DEMO_MAX_QUESTIONS_PER_SESSION=10,DEMO_MAX_UPLOAD_MB=10 \
            --quiet
      - name: Deploy API
        # Same image, FastAPI entrypoint. Conversations persist in Postgres when
        # the checkpoint-dsn secret exists (see deploy/cloudrun.md §6).
        run: |
          SECRETS="GOOGLE_API_KEY=gemini-api-key:latest,DATAAGENT_API_KEYS=api-keys:latest"
          if gcloud secrets describe checkpoint-dsn --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            SECRETS="$SECRETS,DATAAGENT_CHECKPOINT_DSN=checkpoint-dsn:latest"
          fi
          gcloud run deploy dataagent-api --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --command uvicorn --args "api.main:app,--host,0.0.0.0,--port,8080" \
            --max-instances 2 --min-instances 0 --memory 2Gi --cpu 1 --timeout 300 \
            --set-secrets "$SECRETS" \
            --set-env-vars DATAAGENT_SEMANTIC_CACHE=1 \
            --quiet
