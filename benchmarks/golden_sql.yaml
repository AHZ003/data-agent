# Internal multi-table golden set: Chinook (data/chinook.sqlite, MIT).
#
# Scored by execution accuracy through the same harness as Spider
# (benchmarks/golden_sql_eval.py): the gold SQL is executed and compared
# with the agent's result using the Spider rule (order matters only when
# the gold SQL has ORDER BY). Questions that ask for an order say so.
#
# difficulty: easy = one table; medium = joins / grouping; hard =
# subqueries, anti-joins, window functions, multi-step logic.
# tests/test_golden_sql.py checks every gold query runs, is non-empty,
# and that no ORDER BY ... LIMIT answer is decided by a tie.

db: data/chinook.sqlite

cases:
