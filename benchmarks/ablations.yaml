# Ablation configs for `python -m benchmarks.ablate`.
#
# Each run is compared on the same questions (paired Δ + McNemar p) with
# its `baseline:` run, or, if unset, the first run of its benchmark.
# `subset` + `seed` pick a fixed difficulty-stratified sample, so all
# runs of a benchmark see identical questions.
#
# Check the cost before spending: python -m benchmarks.ablate --plan

defaults:
  subset: 200
  seed: 0
  concurrency: 4

runs:
  # ── Spider dev: does self-repair help? ──────────────────────────────
  - name: spider-flash-single
    benchmark: spider
    model: gemini-2.5-flash
    mode: single
  - name: spider-flash-repair
    benchmark: spider
    model: gemini-2.5-flash
    mode: repair

  # ── BIRD mini-dev: evidence hints and self-repair ───────────────────
  - name: bird-flash-evidence-single
    benchmark: bird
    model: gemini-2.5-flash
    mode: single
    evidence: true
  - name: bird-flash-evidence-repair
    benchmark: bird
    model: gemini-2.5-flash
    mode: repair
    evidence: true
  - name: bird-flash-noevidence-repair
    benchmark: bird
    model: gemini-2.5-flash
    mode: repair
    evidence: false

  # ── BIRD: retrieval components, each vs. the repair baseline ─────────
  - name: bird-flash-values
    benchmark: bird
    model: gemini-2.5-flash
    mode: repair
    evidence: true
    baseline: bird-flash-evidence-repair
    flags: {values: true, embedder: gemini}
  - name: bird-flash-schema30
    benchmark: bird
    model: gemini-2.5-flash
    mode: repair
    evidence: true
    baseline: bird-flash-evidence-repair
    flags: {schema_k: 30, embedder: gemini}
  - name: bird-flash-schema30-values
    benchmark: bird
    model: gemini-2.5-flash
    mode: repair
    evidence: true
    baseline: bird-flash-evidence-repair
    flags: {schema_k: 30, values: true, embedder: gemini}
  - name: bird-flash-memory3
    benchmark: bird
    model: gemini-2.5-flash
    mode: repair
    evidence: true
    baseline: bird-flash-evidence-repair
    flags: {memory_k: 3, embedder: gemini}
  - name: bird-flash-all-retrieval
    benchmark: bird
    model: gemini-2.5-flash
    mode: repair
    evidence: true
    baseline: bird-flash-evidence-repair
    flags: {schema_k: 30, values: true, memory_k: 3, embedder: gemini}

  # ── Models & cost frontier (P7) ────────────────────────────────────────
  # Local models need Ollama running (ollama pull qwen2.5-coder:7b) and
  # OLLAMA_USD_PER_HOUR set to your hardware's hourly price for costing.
  - name: spider-pro-repair
    benchmark: spider
    model: gemini-2.5-pro
    mode: repair
    baseline: spider-flash-repair
  - name: spider-qwen7b-base
    benchmark: spider
    model: ollama/qwen2.5-coder:7b
    mode: repair
    baseline: spider-flash-repair
  - name: spider-finetuned-1.5b
    benchmark: spider
    model: ollama/dataagent-sql
    mode: repair
    baseline: spider-flash-repair
  # Run after `python -m routing.train --cheap spider-flash-repair --strong spider-pro-repair`.
  - name: spider-router
    benchmark: spider
    model: router:routing/router.json
    mode: repair
    baseline: spider-pro-repair
